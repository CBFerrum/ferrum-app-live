package: live
version: 0.1.0
label: Live
description: One-to-many live video at low delay through a Media over QUIC relay - broadcasts attached to any record, short-lived signed access for presenters and viewers, a page and an embed for other apps, viewer counts without names on the relay.
depends: [core]

modules:
  - name: live
    label: Live
    icon: video
    order: 48
    items: [Broadcast, BroadcastLink, LiveSettings, report:live_broadcasts, report:live_audience]

roles:
  - name: Live User
    description: Plans broadcasts, presents the ones they are named on, and watches those they may see.
    permissions:
      - {entity: Broadcast, read: true, write: true, create: true, delete: true, export: true, if_owner: true}
      - {entity: BroadcastLink, read: true, write: true, create: true, if_owner: true}
      - {entity: LiveSettings, read: true}
  - name: Live Manager
    description: Every broadcast and link, Live Settings (the relay's address, its signing key, token lifetimes, wording).
    permissions:
      - {entity: Broadcast, read: true, write: true, create: true, delete: true, export: true}
      - {entity: BroadcastLink, read: true, write: true, create: true, delete: true, export: true}
      - {entity: LiveSettings, read: true, write: true, create: true}

# A presenter named on a broadcast or on a one-time link is a person: found by address, blanked on erasure.
# What viewers leave (counts) holds no name and no address, only keyed seats that upkeep deletes.
personal_data:
  - {entity: Broadcast, match: presenter_email, erase: [presenter_name, presenter_email]}
  - {entity: Broadcast, match: publishers.email, erase: [publishers]}
  - {entity: BroadcastLink, match: presenter_email, erase: [presenter_name, presenter_email, label]}
handover:
  - {entity: Broadcast, field: owner_email, where: {status: [Scheduled, Live]}}

events:
  - {name: broadcast_started, label: Broadcast started, entity: Broadcast, description: "A presenter started it; viewers may now watch"}
  - {name: broadcast_ended, label: Broadcast ended, entity: Broadcast, description: "Ended by a presenter, a manager or the upkeep (no presenter for a while)"}
