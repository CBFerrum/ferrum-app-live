[package]
name = "ferrum-app-live"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Live video from one sender to a large audience at low delay, through a Media over QUIC relay: broadcasts attached to any record, signed access, embedding, counts"
repository = "https://github.com/CBFerrum/ferrum-app-live"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
